<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare timetables · Class Timetable Builder</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.mjs"></script>
</head>
<body data-page="compare">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar site-header">
    <div class="topbar-brand">
      <a class="brand" href="/courses.html">Class Timetable Builder</a>
    </div>
    <nav class="topbar-nav" aria-label="Services">
      <a href="/">Catalogue</a>
      <a href="/timetable/">Timetable Builder</a>
      <a href="/compare" aria-current="page">Compare &amp; Share</a>
    </nav>
    <div class="auth-bar">
      <button id="theme-toggle-btn" type="button" class="btn btn-ghost btn-sm" aria-label="Toggle dark mode">
        Dark Mode
      </button>
      <span id="user-label" class="topbar-user" hidden></span>
    </div>
  </header>

  <main id="main" class="container">
    <h1>Compare timetables</h1>
    <p class="lead">Pick 2 to 5 of your saved timetables and choose how to rank them. <a href="share.html">Share a timetable →</a></p>

    <div id="compare-status" class="status" hidden></div>

    <form id="compare-form" class="card" novalidate>
      <fieldset>
        <legend>Your saved timetables</legend>
        <div id="timetable-picker"></div>
        <div id="manual-field" class="field" hidden>
          <label for="manual-ids">Timetable ids (separate with commas)</label>
          <input id="manual-ids" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. tt-1, tt-2">
        </div>
        <p id="selection-hint" class="muted" aria-live="polite"></p>
      </fieldset>

      <div class="field">
        <label for="criterion">Rank by</label>
        <select id="criterion"></select>
      </div>

      <button id="compare-button" class="button primary" type="submit">Compare</button>
    </form>

    <section id="compare-results" class="results" aria-live="polite"></section>
  </main>
</body>
</html>
